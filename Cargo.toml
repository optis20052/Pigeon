[package]
name = "pigeon"
version = "0.1.0"
edition = "2024"
description = "A fast, native API client for GNOME"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
reqwest = { version = "0.13", features = ["json", "multipart", "cookies", "gzip", "brotli", "deflate", "zstd", "stream", "socks", "form", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
base64 = "0.22"
url = "2"
anyhow = "1"
regex = "1"
once_cell = "1"
async-channel = "2"
mime_guess = "2"
urlencoding = "2"
serde_yaml_ng = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
